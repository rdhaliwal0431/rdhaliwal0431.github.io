name: unpack-site
on:
  push:
    paths: ['_bundle/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          base64 -d _bundle/site.tgz.b64 > /tmp/site.tgz
          tar xzf /tmp/site.tgz -C .
          git rm -rq _bundle
          git config user.name "site-bot"; git config user.email "site-bot@users.noreply.github.com"
          git add -A && git commit -m "Unpack site bundle" && git push
